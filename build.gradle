plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty('java.version')}, JVM: ${System.getProperty('java.vm.version')} (${System.getProperty('java.vendor')}), Arch: ${System.getProperty('os.arch')}"

neoForge {
    // Use the combined Minecraft + NeoForge version string so the plugin can resolve the correct runtime.
    // This becomes e.g. "1.20.1-47.1.106"
    version = "${minecraft_version}-${neoforge_version}"

    runs {
        client {
            type = "client"
            gameDirectory = project.file('run')
        }
        server {
            type = "server"
            gameDirectory = project.file('run')
        }
        data {
            type = "data"
            gameDirectory = project.file('run-data')
        }
    }

    // Register local mod(s) so the runs load your mod in dev
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // NeoForge repository (artifact net.neoforged:forge:1.20.1-47.1.106 lives here)
    maven { url = 'https://maven.neoforged.net/releases' }

    // Useful to resolve other libraries
    mavenCentral()
}

dependencies {
    // Resolve the NeoForge runtime/artifact. The correct coordinate is:
    // net.neoforged:forge:<minecraft_version>-<neoforge_version>
    // Example: net.neoforged:forge:1.20.1-47.1.106
    implementation "net.neoforged:forge:${minecraft_version}-${neoforge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // ModDevGradle handles packaging; remove reobfJar (reobf is ForgeGradle-specific)
    // finalizedBy 'reobfJar'   <-- removed on purpose
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.orbital'
            artifactId = 'orbitalradish'
            version = '1.0.0'

            artifact jar
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}